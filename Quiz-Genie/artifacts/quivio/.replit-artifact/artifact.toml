kind = "web"
previewPath = "/"
title = "Quivio"
version = "1.0.0"
id = "artifacts/quivio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25515

[services.development]
run = "pnpm --filter @workspace/quivio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quivio", "run", "build" ]
publicDir = "artifacts/quivio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25515"
BASE_PATH = "/"
